<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 320 64" width="320" height="64">
  <defs>
    <radialGradient id="logoMars" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8552"/>
      <stop offset="45%" stop-color="#ff6b35"/>
      <stop offset="85%" stop-color="#c8451b"/>
      <stop offset="100%" stop-color="#7a240c"/>
    </radialGradient>
    <linearGradient id="logoOrbit" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8"/>
      <stop offset="100%" stop-color="#0284c7"/>
    </linearGradient>
    <filter id="logoGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.2" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Group Emblem on Left -->
  <g transform="translate(6, 4)">
    <!-- Deep space subtle badge border -->
    <circle cx="28" cy="28" r="26" fill="#090e18" stroke="#1e293b" stroke-width="1.5"/>

    <!-- Back arc of Orbit Ring -->
    <ellipse cx="28" cy="28" rx="22" ry="8" 
             fill="none" stroke="#0ea5e9" stroke-width="1.8" stroke-dasharray="6 3" opacity="0.45"
             transform="rotate(-28 28 28)"/>

    <!-- Mars Planet Body -->
    <circle cx="28" cy="28" r="15" fill="url(#logoMars)"/>

    <!-- Mars Craters -->
    <ellipse cx="33" cy="24" rx="4" ry="2.5" fill="#a43312" opacity="0.75" transform="rotate(-15 33 24)"/>
    <circle cx="23" cy="32" r="3" fill="#a43312" opacity="0.7"/>

    <!-- Front arc of Orbit Ring with Glow -->
    <path d="M 8 34.5 A 22 8 0 0 0 48 21.5" 
          fill="none" stroke="url(#logoOrbit)" stroke-width="2.2" stroke-linecap="round"
          transform="rotate(-28 28 28)" filter="url(#logoGlow)"/>

    <!-- Satellite Beacon -->
    <circle cx="42.5" cy="16" r="2.5" fill="#38bdf8" filter="url(#logoGlow)"/>
    <circle cx="42.5" cy="16" r="1.2" fill="#ffffff"/>
  </g>

  <!-- Typography Wordmark -->
  <g transform="translate(70, 0)">
    <!-- OUTPOST: MARS Primary Title -->
    <text x="0" y="34" font-family="'Rajdhani', -apple-system, sans-serif" font-size="25" font-weight="800" letter-spacing="2.5" fill="#f8fafc">
      OUTPOST<tspan fill="#ff6b35">:</tspan> <tspan fill="#ff8552">MARS</tspan>
    </text>
    
    <!-- Subtitle / Mission Tagline -->
    <text x="1" y="49" font-family="'Inter', system-ui, sans-serif" font-size="9" font-weight="700" letter-spacing="1.8" fill="#38bdf8">
      NASA MISSION CONTROL <tspan fill="#64748b">•</tspan> JEZERO CRATER
    </text>
  </g>

  <!-- Technical Corner Accent Marker -->
  <path d="M 314 12 L 314 6 L 308 6" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
  <path d="M 314 52 L 314 58 L 308 58" fill="none" stroke="#38bdf8" stroke-width="1.5" opacity="0.6"/>
</svg>
