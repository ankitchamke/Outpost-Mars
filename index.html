<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <meta name="description" content="OUTPOST: MARS — A NASA Space Apps 2D Mars outpost mission trainer for young explorers." />
    <meta name="theme-color" content="#0a101c" />
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&family=Rajdhani:wght@500;600;700&display=swap" rel="stylesheet" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="/favicon.ico" />
    <link rel="apple-touch-icon" href="/apple-touch-icon.png" />
    <title>OUTPOST: MARS — NASA Mission Control</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header" role="banner">
        <div class="brand-section">
          <div class="brand-logo-mark" aria-hidden="true">
            <svg width="24" height="24" viewBox="0 0 32 32" fill="none">
              <circle cx="16" cy="16" r="14" fill="#090e18" stroke="#1e293b" stroke-width="1.2"/>
              <ellipse cx="16" cy="16" rx="13" ry="5" fill="none" stroke="#0ea5e9" stroke-width="1.2" stroke-dasharray="4 2" opacity="0.45" transform="rotate(-28 16 16)"/>
              <circle cx="16" cy="16" r="8.5" fill="#ff6b35"/>
              <circle cx="18.5" cy="14" r="1.8" fill="#a43312" opacity="0.75"/>
              <circle cx="13.5" cy="17.5" r="1.4" fill="#a43312" opacity="0.7"/>
              <path d="M 5 19.5 A 13 5 0 0 0 27 12.5" fill="none" stroke="#38bdf8" stroke-width="1.6" stroke-linecap="round" transform="rotate(-28 16 16)"/>
              <circle cx="24.5" cy="9.5" r="1.5" fill="#38bdf8"/>
              <circle cx="24.5" cy="9.5" r="0.8" fill="#ffffff"/>
            </svg>
          </div>
          <div class="brand-text-group">
            <span class="brand-title">OUTPOST: MARS</span>
            <span class="brand-subtitle">NASA MISSION CONTROL</span>
          </div>
          <span class="brand-badge">Jezero Crater</span>
        </div>
        <div class="header-controls" role="toolbar" aria-label="Mission quick controls">
          <button id="btn-help" class="btn btn-sm" aria-label="Toggle first-time tutorial guide" aria-pressed="false">
            <svg class="btn-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <circle cx="12" cy="12" r="10"></circle>
              <path d="M9.09 9a3 3 0 0 1 5.83 1c0 2-3 3-3 3"></path>
              <line x1="12" y1="17" x2="12.01" y2="17"></line>
            </svg>
            <span class="btn-label">Help</span>
          </button>
          <button id="btn-science-log" class="btn btn-sm" aria-label="Toggle NASA science challenges and Science Log" aria-pressed="false">
            <svg class="btn-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M4 19.5v-15A2.5 2.5 0 0 1 6.5 2H20v20H6.5a2.5 2.5 0 0 1-2.5-2.5Z"></path>
              <path d="M6 6h10"></path>
              <path d="M6 10h10"></path>
              <path d="M9 16l2 2 4-4"></path>
            </svg>
            <span class="btn-label">Science Log</span>
          </button>
          <div class="audio-control-wrapper">
            <button id="btn-audio" class="btn btn-sm" aria-label="Toggle audio settings" aria-pressed="false" aria-expanded="false" aria-controls="audio-settings-popover">
              <svg id="btn-audio-icon" class="btn-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
                <polygon points="11 5 6 9 2 9 2 15 6 15 11 19 11 5"></polygon>
                <path d="M15.54 8.46a5 5 0 0 1 0 7.07"></path>
                <path d="M19.07 4.93a10 10 0 0 1 0 14.14"></path>
              </svg>
              <span class="btn-label">Audio</span>
            </button>

            <div id="audio-settings-popover" class="audio-settings-popover" hidden role="dialog" aria-label="Audio Controls" aria-modal="false">
              <div class="audio-popover-header">
                <span class="audio-popover-title">AUDIO &amp; COMMS</span>
                <button id="btn-audio-close" class="audio-popover-close" aria-label="Close audio controls" type="button">&times;</button>
              </div>
              <div class="audio-popover-body">
                <div class="audio-setting-row">
                  <div class="audio-label-group">
                    <label for="slider-master-volume" class="audio-label">Master Volume</label>
                    <span id="label-master-volume" class="audio-volume-badge">70%</span>
                  </div>
                  <input type="range" id="slider-master-volume" class="audio-range-slider" min="0" max="100" value="70" step="1" aria-label="Master volume level" />
                </div>

                <div class="audio-setting-row audio-toggle-row">
                  <div class="audio-toggle-info">
                    <span class="audio-label">Martian Atmosphere</span>
                    <span class="audio-sublabel">Ambient drone &amp; surface wind</span>
                  </div>
                  <button id="btn-toggle-music" class="audio-toggle-btn is-active" type="button" aria-pressed="true">ON</button>
                </div>

                <div class="audio-setting-row audio-toggle-row">
                  <div class="audio-toggle-info">
                    <span class="audio-label">Telemetry &amp; SFX</span>
                    <span class="audio-sublabel">Interface &amp; mission chirps</span>
                  </div>
                  <button id="btn-toggle-sfx" class="audio-toggle-btn is-active" type="button" aria-pressed="true">ON</button>
                </div>

                <div class="audio-popover-footer">
                  <button id="btn-mute-all" class="audio-mute-all-btn" type="button">Mute All</button>
                </div>
              </div>
            </div>
          </div>
          <button id="btn-save-state" class="btn btn-sm" aria-label="Save current mission state">
            <svg class="btn-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M19 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h11l5 5v11a2 2 0 0 1-2 2z"></path>
              <polyline points="17 21 17 13 7 13 7 21"></polyline>
              <polyline points="7 3 7 8 15 8"></polyline>
            </svg>
            <span class="btn-label">Save</span>
          </button>
          <button id="btn-reset-state" class="btn btn-sm btn-destructive" aria-label="Reset mission state">
            <svg class="btn-icon" aria-hidden="true" width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round">
              <path d="M3 12a9 9 0 1 0 9-9 9.75 9.75 0 0 0-6.74 2.74L3 8"></path>
              <path d="M3 3v5h5"></path>
            </svg>
            <span class="btn-label">Reset</span>
          </button>
        </div>
      </header>

      <main class="viewport-container" role="main">
        <div id="game-container" class="game-container" aria-label="Martian surface 2D viewport" role="region"></div>
        <div id="hud-container" class="hud-overlay"></div>
        <div id="mission-objectives-container" class="objectives-overlay" aria-label="Mission Objectives" hidden></div>
        <div id="building-prompt-container" class="building-prompt-overlay" aria-live="polite" hidden></div>
        <div id="building-panel-container" class="panel-overlay" aria-label="Building Field Guide" hidden></div>
        <div id="science-console-container" class="science-overlay" hidden></div>
        <div id="mission-feedback-container" class="mission-feedback-overlay" hidden></div>
        <div id="space-weather-container" class="space-weather-overlay" hidden></div>
        <div id="discovery-dialog-container" class="discovery-dialog-overlay" hidden></div>
        <div id="tutorial-container" class="tutorial-overlay" hidden></div>
        <div id="toast-container" class="hud-toast-container" aria-live="polite" aria-atomic="true"></div>
      </main>
      <div id="reset-choice-container" class="reset-choice-overlay" hidden></div>

      <footer class="app-footer" role="contentinfo">
        <div class="footer-telemetry-group">
          <div class="footer-pulse-dot" aria-hidden="true"></div>
          <span id="mission-status-footer" aria-live="polite">Sol 1/5 &bull; Crew nominal</span>
          <div id="footer-sol-progress" class="mini-sol-indicator" aria-label="Sol 5-stage progress indicator">
            <span class="mini-sol-dot is-active" title="Sol 1" data-sol-dot="1"></span>
            <span class="mini-sol-dot" title="Sol 2" data-sol-dot="2"></span>
            <span class="mini-sol-dot" title="Sol 3" data-sol-dot="3"></span>
            <span class="mini-sol-dot" title="Sol 4" data-sol-dot="4"></span>
            <span class="mini-sol-dot" title="Sol 5" data-sol-dot="5"></span>
          </div>
        </div>
        <span class="footer-credits">Scientific Trainer &bull; NASA Space Apps</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
