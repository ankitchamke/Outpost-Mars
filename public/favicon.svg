<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <radialGradient id="marsBody" cx="35%" cy="30%" r="70%">
      <stop offset="0%" stop-color="#ff8552"/>
      <stop offset="45%" stop-color="#ff6b35"/>
      <stop offset="85%" stop-color="#c8451b"/>
      <stop offset="100%" stop-color="#7a240c"/>
    </radialGradient>
    <linearGradient id="orbitGlow" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38bdf8" stop-opacity="0.95"/>
      <stop offset="50%" stop-color="#06b6d4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#0284c7" stop-opacity="0.2"/>
    </linearGradient>
    <filter id="glow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="1.5" result="blur"/>
      <feComposite in="SourceGraphic" in2="blur" operator="over"/>
    </filter>
  </defs>

  <!-- Deep space background disk for high contrast -->
  <circle cx="32" cy="32" r="30" fill="#070b12" stroke="#1e293b" stroke-width="1.5"/>

  <!-- Back arc of Orbit Ring -->
  <ellipse cx="32" cy="32" rx="25" ry="10" 
           fill="none" stroke="#0ea5e9" stroke-width="2" stroke-dasharray="8 4" opacity="0.45"
           transform="rotate(-28 32 32)"/>

  <!-- Mars Planet Body -->
  <circle cx="32" cy="32" r="18" fill="url(#marsBody)"/>

  <!-- Mars Surface Features / Craters -->
  <ellipse cx="38" cy="27" rx="5" ry="3" fill="#a43312" opacity="0.75" transform="rotate(-15 38 27)"/>
  <circle cx="26" cy="37" r="4" fill="#a43312" opacity="0.7"/>
  <circle cx="33" cy="42" r="2.2" fill="#a43312" opacity="0.6"/>
  <ellipse cx="28" cy="25" rx="2.5" ry="1.5" fill="#ffaa80" opacity="0.5"/>

  <!-- Atmospheric Rim Glow (Crescent) -->
  <path d="M 21.5 19.5 A 18 18 0 0 1 44 42 A 18.5 18.5 0 0 0 21.5 19.5 Z" fill="#ffaa80" opacity="0.35"/>

  <!-- Front arc of Orbit Ring with Glow -->
  <path d="M 9.5 39.5 A 25 10 0 0 0 54.5 24.5" 
        fill="none" stroke="url(#orbitGlow)" stroke-width="2.5" stroke-linecap="round"
        transform="rotate(-28 32 32)" filter="url(#glow)"/>

  <!-- Orbiting Satellite Beacon / Outpost Node -->
  <circle cx="48.5" cy="18.5" r="3" fill="#38bdf8" filter="url(#glow)"/>
  <circle cx="48.5" cy="18.5" r="1.5" fill="#ffffff"/>
</svg>
