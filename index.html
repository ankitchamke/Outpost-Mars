<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="description" content="OUTPOST: MARS — A NASA Space Apps 2D Mars outpost mission trainer for young explorers." />
    <meta name="theme-color" content="#121822" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <link rel="alternate icon" type="image/x-icon" href="./favicon.ico" />
    <title>OUTPOST: MARS</title>
  </head>
  <body>
    <div id="app">
      <header class="app-header" role="banner">
        <div class="brand-section">
          <span class="brand-title">OUTPOST: MARS</span>
          <span class="brand-badge">Jezero Crater</span>
        </div>
        <div class="header-controls" role="toolbar" aria-label="Mission quick controls">
          <button id="btn-help" class="btn btn-sm" aria-label="Toggle first-time tutorial guide" aria-pressed="false">Help</button>
          <button id="btn-science-log" class="btn btn-sm" aria-label="Toggle NASA science challenges and Science Log" aria-pressed="false">Science Log</button>
          <button id="btn-save-state" class="btn btn-sm" aria-label="Save current mission state">Save</button>
          <button id="btn-reset-state" class="btn btn-sm btn-destructive" aria-label="Reset mission state">Reset</button>
        </div>
      </header>

      <main class="viewport-container" role="main">
        <div id="game-container" class="game-container" aria-label="Martian surface 2D viewport" role="region"></div>
        <div id="hud-container" class="hud-overlay"></div>
        <div id="mission-objectives-container" class="objectives-overlay" aria-label="Mission Objectives" hidden></div>
        <div id="building-prompt-container" class="building-prompt-overlay" aria-live="polite" hidden></div>
        <div id="building-panel-container" class="panel-overlay" aria-label="Building Field Guide" hidden></div>
        <div id="science-console-container" class="science-overlay" hidden></div>
        <div id="mission-feedback-container" class="mission-feedback-overlay" hidden></div>
        <div id="tutorial-container" class="tutorial-overlay" hidden></div>
      </main>
      <div id="reset-choice-container" class="reset-choice-overlay" hidden></div>

      <footer class="app-footer" role="contentinfo">
        <span id="mission-status-footer" aria-live="polite">Sol 1/5 &bull; Crew nominal</span>
        <span class="footer-credits">Scientific Trainer &bull; NASA Space Apps</span>
      </footer>
    </div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
